<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe — Neon Arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="game-body">
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-c"></div>

  <header class="game-top">
    <a class="back-link" href="index.html">← Arcade</a>
    <div class="game-title">⭕ ❌ <b>Tic Tac Toe</b></div>
    <div class="round-pips" id="roundPips"></div>
  </header>

  <main class="ttt-layout">
    <section class="ttt-setup glass" id="tttSetup">
      <div class="setup-title">New Match</div>
      <div class="setup-row">
        <span>Rounds (wins needed)</span>
        <div class="pill-group" id="roundSel">
          <button class="pill active" data-n="1">1</button>
          <button class="pill" data-n="3">3</button>
          <button class="pill" data-n="5">5</button>
          <button class="pill" data-n="7">7</button>
        </div>
      </div>
      <div class="setup-row">
        <span>Player 1</span>
        <div class="input-wrap"><input id="p1Name" maxlength="10" value="Player X" placeholder="Player X"></div>
      </div>
      <div class="setup-row">
        <span>Player 2</span>
        <div class="input-wrap"><input id="p2Name" maxlength="10" value="Player O" placeholder="Player O"></div>
      </div>
      <button id="tttStart" class="btn btn-primary btn-block">Start Match</button>
    </section>

    <section class="ttt-play hidden" id="tttPlay">
      <div class="ttt-turn">
        <span id="tttTurnName">Player X</span>
        <span class="turn-dot" id="tttTurnDot"></span>
        <span id="tttTurnSym" class="turn-sym">X</span>
      </div>

      <div class="board" id="board">
        <button class="cell" data-i="0"></button>
        <button class="cell" data-i="1"></button>
        <button class="cell" data-i="2"></button>
        <button class="cell" data-i="3"></button>
        <button class="cell" data-i="4"></button>
        <button class="cell" data-i="5"></button>
        <button class="cell" data-i="6"></button>
        <button class="cell" data-i="7"></button>
        <button class="cell" data-i="8"></button>
      </div>

      <div id="tttStatus" class="ttt-status"></div>
      <div class="result-actions">
        <button id="tttReset" class="btn btn-ghost">New Match</button>
      </div>
    </section>
  </main>

  <section class="scorebar" id="tttScore">
    <div class="score-chip you"><span id="tttP1Label">Player X</span><b id="tttP1">0</b></div>
    <div class="score-chip draw"><span>ROUND</span><b id="tttRound">0</b></div>
    <div class="score-chip pi"><span id="tttP2Label">Player O</span><b id="tttP2">0</b></div>
  </section>

  <div id="flash" class="flash"></div>

  <script src="js/audio.js"></script>
  <script src="js/ttt.js"></script>
</body>
</html>
